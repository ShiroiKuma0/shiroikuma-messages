android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx8192m

# Versioning
# VERSION_NAME / VERSION_CODE track upstream (FossifyOrg/Messages).
# BUILD_NUMBER is our fork increment, bumped on every build with changes.
# Stored bare here; the counter is zero-padded to three digits wherever it is RENDERED (app/build.gradle.kts).
# Fork versionName = "<VERSION_NAME>+<NNN>", versionCode = VERSION_CODE * 10000 + BUILD_NUMBER.
VERSION_NAME=1.9.1
VERSION_CODE=23
BUILD_NUMBER=20
# Installed package id for our fork (kept distinct so it coexists with upstream).
APP_ID=shiroikuma.messeji
# Code namespace stays on the upstream package so R/BuildConfig and sources are unchanged.
APP_NAMESPACE=org.fossify.messages
